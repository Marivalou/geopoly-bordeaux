<div id="geopoly-app" style="background-color:light-dark(#f7f4ed,#151515);color:light-dark(#1e1e1e,#f3f3f3);padding:24px;min-height:100%;border-radius:0;font-family:Arial,Helvetica,sans-serif;">

<style>
#geopoly-app *{box-sizing:border-box}
#geopoly-app .wrap{max-width:760px;margin:0 auto}
#geopoly-app .hero{background:light-dark(#ffffff,#222);border:1px solid light-dark(#ded8ca,#333);border-radius:18px;padding:22px;margin-bottom:18px}
#geopoly-app .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.68}
#geopoly-app h2{margin:6px 0 10px;font-size:30px;line-height:1.05}
#geopoly-app .scorebar{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
#geopoly-app .pill{background:light-dark(#f0ede5,#2d2d2d);border-radius:999px;padding:10px 14px;font-weight:700}
#geopoly-app .card{background:light-dark(#ffffff,#222);border:1px solid light-dark(#ded8ca,#333);border-radius:18px;padding:22px}
#geopoly-app .place{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.65}
#geopoly-app .question{font-size:22px;font-weight:700;line-height:1.25;margin:10px 0 18px}

#geopoly-app .question-logo{
display:flex;
justify-content:center;
align-items:center;
margin:0 0 18px
}

#geopoly-app .question-logo img{
display:block;
max-width:240px;
width:70%;
height:auto;
object-fit:contain
}

#geopoly-app .answers{display:grid;gap:10px}
#geopoly-app .open-answer{display:grid;gap:10px}

#geopoly-app .open-answer input{
font:inherit;
font-size:16px;
min-height:48px;
border-radius:12px;
border:1px solid light-dark(#cfc7b8,#444);
padding:12px 14px;
background:light-dark(#faf8f3,#292929);
color:inherit;
width:100%
}

#geopoly-app button{
font:inherit;
min-height:48px;
border-radius:12px;
border:1px solid light-dark(#cfc7b8,#444);
padding:12px 14px;
cursor:pointer;
background:light-dark(#faf8f3,#292929);
color:inherit;
text-align:left
}

#geopoly-app button:hover{
background:light-dark(#f1eee7,#333)
}

#geopoly-app button:focus,
#geopoly-app input:focus{
outline:3px solid light-dark(#6f6f6f,#b8b8b8);
outline-offset:2px
}

#geopoly-app .actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:16px
}

#geopoly-app .primary{
background:light-dark(#202020,#f2f2f2);
color:light-dark(#fff,#111);
border-color:transparent;
text-align:center;
font-weight:700;
flex:1
}

#geopoly-app .skip{
text-align:center;
flex:1
}

#geopoly-app .feedback{
margin-top:16px;
padding:14px;
border-radius:12px;
background:light-dark(#f2efe8,#2b2b2b);
font-weight:700;
display:none
}

#geopoly-app .progress{
height:8px;
background:light-dark(#e7e0d3,#303030);
border-radius:999px;
overflow:hidden;
margin:14px 0 0
}

#geopoly-app .progress>div{
height:100%;
background:light-dark(#333,#ddd);
width:0%;
transition:width .25s ease
}

#geopoly-app .final{display:none}

#geopoly-app .rank{
font-size:28px;
font-weight:800;
margin:12px 0
}

#geopoly-app .summary{
display:grid;
gap:8px;
margin-top:16px
}

#geopoly-app .row{
display:flex;
justify-content:space-between;
gap:16px;
border-bottom:1px solid light-dark(#e5dfd5,#333);
padding:10px 0
}

#geopoly-app .small{
font-size:14px;
opacity:.72
}

@media(max-width:480px){

#geopoly-app{padding:14px}

#geopoly-app h2{font-size:25px}

#geopoly-app .question{font-size:20px}

#geopoly-app .actions{flex-direction:column}

}
</style>


<div class="wrap">

<section class="hero">

<div class="eyebrow">
GEOPOLY BORDEAUX
</div>

<h2>
Questions bonus
</h2>

<div>
Les 5 premières questions rapportent des points.
La question finale se débloque uniquement si les 5 premières sont réussies.
</div>

<div class="scorebar">

<div class="pill">
⭐ Score : <span id="score">0</span>
</div>

<div class="pill">
Question <span id="step">1</span>/<span id="totalQuestions">6</span>
</div>

</div>

<div class="progress">
<div id="progress"></div>
</div>

</section>


<section class="card" id="quizCard">

<div class="place" id="place"></div>

<div class="question" id="question"></div>

<div class="question-logo">

<img
src="./logo-geopoly-bordeaux.png?v=3"
alt="Logo GEOPOLY BORDEAUX">

</div>

<div class="answers" id="answers"></div>

<div
class="feedback"
id="feedback"
aria-live="polite">
</div>

<div class="actions">

<button
type="button"
class="skip"
id="skipBtn">

Passer cette question

</button>

<button
type="button"
class="primary"
id="nextBtn"
disabled>

Continuer

</button>

</div>

</section>


<section
class="card final"
id="finalCard">

<div class="eyebrow">
Résultat
</div>

<div
class="rank"
id="rank">
</div>

<div id="finalScore"></div>

<div
class="summary"
id="summary">
</div>

<div class="actions">

<button
type="button"
class="primary"
id="restartBtn">

Recommencer

</button>

</div>

</section>

</div>


<script>

(()=>{

const root =
document.getElementById('geopoly-app');

if(root.dataset.init)return;

root.dataset.init='1';



/* ===================================================
   LES 6 QUESTIONS
=================================================== */

const questions = [

{
place:'Grosse Cloche',

q:'Combien de cadrans possède la Grosse Cloche ?',

acceptedAnswers:[
'2',
'deux'
],

points:2
},


{
place:'Grand Théâtre',

q:'Combien de colonnes composent la façade principale ?',

acceptedAnswers:[
'12',
'douze'
],

points:3
},


{
place:'Porte Cailhau',

q:'À quel siècle la Porte Cailhau a-t-elle été construite ?',

acceptedAnswers:[
'xve',
'15',
'15e',
'quinzieme',
'quinzième'
],

points:3
},


{
place:'Place de la Bourse',

q:'Quel élément emblématique se trouve juste en face de la place ?',

acceptedAnswers:[
'miroir d eau',
'le miroir d eau',
'miroir d’eau',
'le miroir d’eau'
],

points:2
},


{
place:'Cité du Vin',

q:'À quoi la forme du bâtiment fait-elle notamment référence ?',

acceptedAnswers:[
'une vague et le vin en mouvement',
'vague et vin en mouvement',
'vin en mouvement'
],

points:4
},


{
place:'QUESTION FINALE',

q:'À remplacer : écris ici ta question finale.',

acceptedAnswers:[
'reponse finale',
'réponse finale'
],

points:5,

final:true
}

];



/* ===================================================
   SAUVEGARDE
=================================================== */

const STORAGE_KEY =
'geopoly-bordeaux-progress-v4';


let index = 0;

let score = 0;

let answered = false;

const results = [];



function saveProgress(){

try{

localStorage.setItem(

STORAGE_KEY,

JSON.stringify({

index:index,

score:score,

results:results

})

);

}

catch(e){}

}



function loadProgress(){

try{

const saved =
JSON.parse(
localStorage.getItem(STORAGE_KEY)
|| 'null'
);


if(!saved)return;


if(
Number.isInteger(saved.index)
&&
saved.index >= 0
&&
saved.index <= questions.length
){

index =
saved.index;

}


if(
Number.isFinite(saved.score)
&&
saved.score >= 0
){

score =
saved.score;

}


if(Array.isArray(saved.results)){

results.length = 0;


saved.results
.slice(0,questions.length)
.forEach(result=>{

results.push(result);

});

}

}

catch(e){}

}



function clearProgress(){

try{

localStorage.removeItem(
STORAGE_KEY
);

}

catch(e){}

}



/* ===================================================
   ELEMENTS
=================================================== */

const scoreEl =
root.querySelector('#score');


const stepEl =
root.querySelector('#step');


const progressEl =
root.querySelector('#progress');


const placeEl =
root.querySelector('#place');


const qEl =
root.querySelector('#question');


const answersEl =
root.querySelector('#answers');


const feedbackEl =
root.querySelector('#feedback');


const skipBtn =
root.querySelector('#skipBtn');


const nextBtn =
root.querySelector('#nextBtn');


const quizCard =
root.querySelector('#quizCard');


const finalCard =
root.querySelector('#finalCard');


root
.querySelector('#totalQuestions')
.textContent =
questions.length;



/* ===================================================
   NORMALISATION DES REPONSES
=================================================== */

function normalizeAnswer(value){

return value

.toLowerCase()

.normalize('NFD')

.replace(
/[\u0300-\u036f]/g,
''
)

.replace(
/[^a-z0-9]+/g,
' '
)

.trim();

}



/* ===================================================
   VERIFICATION DES 5 PREMIERES QUESTIONS
=================================================== */

function firstFiveSucceeded(){

for(
let questionNumber = 0;
questionNumber < 5;
questionNumber++
){

const result =
results.find(

r =>
r.questionIndex === questionNumber

);


if(
!result
||
result.status !== 'Bonne réponse'
){

return false;

}

}


return true;

}



/* ===================================================
   AFFICHAGE QUESTION
=================================================== */

function render(){

const item =
questions[index];



/* Vérification avant d'afficher la question 6 */

if(
index === 5
&&
!firstFiveSucceeded()
){

finishLocked();

return;

}



answered =
false;


nextBtn.disabled =
true;


feedbackEl.style.display =
'none';


feedbackEl.textContent =
'';



/* La question finale ne peut pas être passée */

if(index === 5){

skipBtn.style.display =
'none';

}

else{

skipBtn.style.display =
'block';

skipBtn.disabled =
false;

}



scoreEl.textContent =
score;


stepEl.textContent =
index + 1;


progressEl.style.width =

(
(index / questions.length)
* 100
)
+
'%';


placeEl.textContent =

item.place
+
' · Bonus +'
+
item.points
+
' points';


qEl.textContent =
item.q;


answersEl.innerHTML =
'';



/* Champ de réponse */

const form =
document.createElement('form');


form.className =
'open-answer';



const input =
document.createElement('input');


input.type =
'text';


input.autocomplete =
'off';


input.placeholder =
'Saisissez votre réponse';


input.setAttribute(
'aria-label',
'Votre réponse'
);



const submit =
document.createElement('button');


submit.type =
'submit';


submit.className =
'primary';


submit.textContent =
'Valider ma réponse';



form.appendChild(
input
);


form.appendChild(
submit
);


answersEl.appendChild(
form
);



form.addEventListener(

'submit',

event=>{

event.preventDefault();


checkOpenAnswer(

input.value,

input,

submit

);

}

);


input.focus();

}



/* ===================================================
   VERIFICATION DE LA REPONSE
=================================================== */

function checkOpenAnswer(
value,
input,
submit
){

if(answered)return;



if(!value.trim()){

feedbackEl.textContent =
'Saisis une réponse avant de valider.';


feedbackEl.style.display =
'block';


return;

}



answered =
true;


skipBtn.disabled =
true;


input.disabled =
true;


submit.disabled =
true;



const item =
questions[index];


const normalized =
normalizeAnswer(value);



const correct =

item.acceptedAnswers.some(

acceptedAnswer =>

normalizeAnswer(
acceptedAnswer
)

===

normalized

);



if(correct){

score +=
item.points;


feedbackEl.textContent =

'Bonne réponse ! +'
+
item.points
+
' points';



/* IMPORTANT :
   mémorise le numéro de la question */

results.push({

questionIndex:
index,

place:
item.place,

status:
'Bonne réponse',

points:
item.points

});

}

else{

feedbackEl.textContent =

index === 5

?

'Réponse incorrecte.'

:

'Réponse incorrecte. 0 point, mais tu peux continuer.';



results.push({

questionIndex:
index,

place:
item.place,

status:
'Incorrecte',

points:
0

});

}



feedbackEl.style.display =
'block';


scoreEl.textContent =
score;


nextBtn.disabled =
false;


saveProgress();

}



/* ===================================================
   PASSER UNE QUESTION
=================================================== */

skipBtn.addEventListener(

'click',

()=>{

if(
answered
||
index === 5
)
return;


answered =
true;



results.push({

questionIndex:
index,

place:
questions[index].place,

status:
'Passée',

points:
0

});



feedbackEl.textContent =

'Question passée. Aucun point gagné et le parcours continue.';


feedbackEl.style.display =
'block';



answersEl
.querySelectorAll(
'input,button'
)
.forEach(element=>{

element.disabled =
true;

});


skipBtn.disabled =
true;


nextBtn.disabled =
false;


saveProgress();

}

);



/* ===================================================
   CONTINUER
=================================================== */

nextBtn.addEventListener(

'click',

()=>{

index++;


saveProgress();


if(
index < questions.length
){

render();

}

else{

finish();

}

}

);



/* ===================================================
   QUESTION 6 VERROUILLEE
=================================================== */

function finishLocked(){

quizCard.style.display =
'none';


finalCard.style.display =
'block';


progressEl.style.width =
'83.33%';


root
.querySelector('#rank')
.textContent =

'Question finale verrouillée';



root
.querySelector('#finalScore')
.textContent =

'La question 6 est accessible uniquement si les 5 premières réponses sont correctes.';



const summary =
root.querySelector('#summary');


summary.innerHTML =
'';



results
.filter(result =>
result.questionIndex < 5
)
.forEach(result=>{

const row =
document.createElement('div');


row.className =
'row';


row.innerHTML =

'<span>'
+
result.place
+
'<div class="small">'
+
result.status
+
'</div>'
+
'</span>'
+
'<strong>+'
+
result.points
+
'</strong>';


summary.appendChild(
row
);

});


saveProgress();

}



/* ===================================================
   RESULTAT FINAL
=================================================== */

function finish(){

quizCard.style.display =
'none';


finalCard.style.display =
'block';


progressEl.style.width =
'100%';



const max =
questions.reduce(

(total,question) =>

total
+
question.points,

0

);



let rank =
'Explorateur de Bordeaux';


if(score >= 16){

rank =
'Grand Maître GEOPOLY';

}

else if(score >= 11){

rank =
'Expert bordelais';

}

else if(score >= 6){

rank =
'Aventurier bordelais';

}



root
.querySelector('#rank')
.textContent =
rank;



root
.querySelector('#finalScore')
.textContent =

'Score : '
+
score
+
' / '
+
max
+
' points';



const summary =
root.querySelector('#summary');


summary.innerHTML =
'';



results.forEach(result=>{

const row =
document.createElement('div');


row.className =
'row';


row.innerHTML =

'<span>'
+
result.place
+
'<div class="small">'
+
result.status
+
'</div>'
+
'</span>'
+
'<strong>+'
+
result.points
+
'</strong>';


summary.appendChild(
row
);

});


saveProgress();

}



/* ===================================================
   RECOMMENCER
=================================================== */

root
.querySelector('#restartBtn')
.addEventListener(

'click',

()=>{

index =
0;


score =
0;


results.length =
0;


clearProgress();


quizCard.style.display =
'block';


finalCard.style.display =
'none';


skipBtn.style.display =
'block';


render();

}

);



/* ===================================================
   DEMARRAGE
=================================================== */

loadProgress();


if(
index >= questions.length
){

finish();

}

else{

render();
